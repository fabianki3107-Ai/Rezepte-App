# XcodeGen-Spezifikation. Projekt erzeugen mit:
#   brew install xcodegen && xcodegen generate
# Danach RezepteApp.xcodeproj in Xcode 16+ öffnen.
name: RezepteApp
options:
  bundleIdPrefix: de.fabian.rezepte
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
targets:
  RezepteApp:
    type: application
    platform: iOS
    sources:
      - path: RezepteApp
    info:
      path: RezepteApp/Resources/Info.plist
      properties:
        CFBundleDisplayName: Rezepte
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: "Die Kamera wird genutzt, um Rezepte aus Kochbüchern oder Zetteln abzufotografieren. Die Bilder bleiben auf deinem Gerät."
        NSPhotoLibraryUsageDescription: "Wähle Screenshots oder Fotos aus, um Rezepte lokal zu importieren."
        NSHealthUpdateUsageDescription: "Geloggte Mahlzeiten (Kalorien, Eiweiß, Kohlenhydrate, Fett) werden lokal in Apple Health eingetragen."
        NSHealthShareUsageDescription: "Die App liest keine Gesundheitsdaten; die Berechtigung dient nur dem Schreiben von Ernährungsdaten."
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: de.fabian.rezepte
            CFBundleURLSchemes: [rezepte]
    entitlements:
      path: RezepteApp/Resources/RezepteApp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.de.fabian.rezepte
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    dependencies:
      - target: RezepteShareExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.fabian.rezepte.app
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  RezepteShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: RezepteShareExtension
      - path: RezepteApp/Import/Inbox/ImportInboxItem.swift
      - path: RezepteApp/Import/Instagram/InstagramLinkParser.swift
      - path: RezepteApp/Import/Instagram/SocialLinkParser.swift
      - path: RezepteApp/Extensions/String+Parsing.swift
    info:
      path: RezepteShareExtension/Info.plist
      properties:
        CFBundleDisplayName: In Rezepte sichern
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 1
    entitlements:
      path: RezepteShareExtension/RezepteShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.de.fabian.rezepte
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.fabian.rezepte.app.share
  RezepteAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RezepteAppTests
    dependencies:
      - target: RezepteApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.fabian.rezepte.app.tests
schemes:
  RezepteApp:
    build:
      targets:
        RezepteApp: all
        RezepteAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RezepteAppTests
