# XcodeGen-Spezifikation. Projekt erzeugen mit:
#   brew install xcodegen && xcodegen generate
# Danach Kochlog.xcodeproj in Xcode 16+ öffnen.
name: Kochlog
options:
  bundleIdPrefix: io.github.fabianki3107.kochlog
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
targets:
  Kochlog:
    type: application
    platform: iOS
    sources:
      - path: Kochlog
    info:
      path: Kochlog/Resources/Info.plist
      properties:
        CFBundleDisplayName: Kochlog
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: "Die Kamera wird genutzt, um Rezepte aus Kochbüchern oder Zetteln abzufotografieren. Die Bilder bleiben auf deinem Gerät."
        NSPhotoLibraryUsageDescription: "Wähle Screenshots oder Fotos aus, um Rezepte lokal zu importieren."
        NSHealthUpdateUsageDescription: "Geloggte Mahlzeiten (Kalorien, Eiweiß, Kohlenhydrate, Fett) werden lokal in Apple Health eingetragen."
        NSHealthShareUsageDescription: "Die App liest keine Gesundheitsdaten; die Berechtigung dient nur dem Schreiben von Ernährungsdaten."
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: io.github.fabianki3107.kochlog
            CFBundleURLSchemes: [kochlog]
    entitlements:
      path: Kochlog/Resources/Kochlog.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.github.fabianki3107.kochlog
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    dependencies:
      - target: KochlogShareExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.fabianki3107.kochlog
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  KochlogShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: KochlogShareExtension
      - path: Kochlog/Import/Inbox/ImportInboxItem.swift
      - path: Kochlog/Import/Instagram/InstagramLinkParser.swift
      - path: Kochlog/Import/Instagram/SocialLinkParser.swift
      - path: Kochlog/Extensions/String+Parsing.swift
    info:
      path: KochlogShareExtension/Info.plist
      properties:
        CFBundleDisplayName: In Kochlog sichern
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 1
    entitlements:
      path: KochlogShareExtension/KochlogShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.github.fabianki3107.kochlog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.fabianki3107.kochlog.share
  KochlogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KochlogTests
    dependencies:
      - target: Kochlog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.fabianki3107.kochlog.tests
schemes:
  Kochlog:
    build:
      targets:
        Kochlog: all
        KochlogTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KochlogTests
