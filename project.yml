# XcodeGen-Spezifikation. Projekt erzeugen mit:
#   brew install xcodegen && xcodegen generate
# Danach Portio.xcodeproj in Xcode 16+ öffnen.
name: Portio
options:
  bundleIdPrefix: io.github.fabianki3107.portio
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
targets:
  Portio:
    type: application
    platform: iOS
    sources:
      - path: Portio
    info:
      path: Portio/Resources/Info.plist
      properties:
        CFBundleDisplayName: Portio
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: "Die Kamera wird genutzt, um Rezepte aus Kochbüchern oder Zetteln abzufotografieren. Die Bilder bleiben auf deinem Gerät."
        NSPhotoLibraryUsageDescription: "Wähle Screenshots oder Fotos aus, um Rezepte lokal zu importieren."
        NSHealthUpdateUsageDescription: "Geloggte Mahlzeiten (Kalorien, Eiweiß, Kohlenhydrate, Fett) werden lokal in Apple Health eingetragen."
        NSHealthShareUsageDescription: "Die App liest keine Gesundheitsdaten; die Berechtigung dient nur dem Schreiben von Ernährungsdaten."
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: io.github.fabianki3107.portio
            CFBundleURLSchemes: [portio]
    entitlements:
      path: Portio/Resources/Portio.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.github.fabianki3107.portio
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    dependencies:
      - target: PortioShareExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.fabianki3107.portio
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  PortioShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: PortioShareExtension
      - path: Portio/Import/Inbox/ImportInboxItem.swift
      - path: Portio/Import/Instagram/InstagramLinkParser.swift
      - path: Portio/Import/Instagram/SocialLinkParser.swift
      - path: Portio/Extensions/String+Parsing.swift
    info:
      path: PortioShareExtension/Info.plist
      properties:
        CFBundleDisplayName: In Portio sichern
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 1
    entitlements:
      path: PortioShareExtension/PortioShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.github.fabianki3107.portio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.fabianki3107.portio.share
  PortioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PortioTests
    dependencies:
      - target: Portio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.fabianki3107.portio.tests
schemes:
  Portio:
    build:
      targets:
        Portio: all
        PortioTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PortioTests
